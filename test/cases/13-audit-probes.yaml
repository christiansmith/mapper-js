# Characterization probes added after the conformance audit (SPEC.md Appendix A
# rows A11, A12, and the §4.3 write-through behavior). Each pins actual
# reference-implementation behavior the specification records as a deviation.
suite: audit probes
tests:
  - description: 'A11: $extend registered at evaluation time is resolved (ancestor pairings inherited)'
    level: mapper
    descriptor:
      mappings:
        'mapping:base':
          $id: 'mapping:base'
          mapping: { /a: /a }
        'mapping:derived':
          $id: 'mapping:derived'
          $extend: 'mapping:base'
          mapping: { /b: /b }
    input: { a: 1, b: 2 }
    expected:
      result: { a: 1, b: 2, valid: true, errors: [] }
      valid: true

  - description: 'A11: unknown $extend ancestor at evaluation time raises an error'
    level: mapper
    descriptor:
      mappings:
        'mapping:orphan':
          $id: 'mapping:orphan'
          $extend: 'mapping:missing'
          mapping: { /b: /b }
    input: { b: 2 }
    throws: Unknown mapping

  - description: 'an overridden $extend pairing evaluates in the descendant position'
    tier: core
    level: mapper
    id: 'mapping:child'
    mappings:
      'mapping:parent':
        $id: 'mapping:parent'
        mapping:
          /b: { constant: original }
          /c: { constant: 1 }
      'mapping:child':
        $id: 'mapping:child'
        $extend: 'mapping:parent'
        mapping:
          /b: { output: /c }
    input: {}
    expected:
      # /b overrides and moves after /c, so it reads the already-written /c
      result: { c: 1, b: 1, valid: true, errors: [] }
      valid: true

  - description: 'CQ3: a mapping extends two ancestors, pairings merge in list order'
    tier: core
    level: mapper
    id: 'mapping:entry'
    mappings:
      'mapping:citation':
        $id: 'mapping:citation'
        mapping:
          /title: /title
          /creator: /author
      'mapping:activity':
        $id: 'mapping:activity'
        mapping:
          /actor: /actor/name
          /published: /date
      'mapping:entry':
        $id: 'mapping:entry'
        $extend: ['mapping:citation', 'mapping:activity']
        mapping:
          /id: /doi
    input:
      title: T
      author: A
      actor: { name: N }
      date: D
      doi: X
    expected:
      result: { title: T, creator: A, actor: N, published: D, id: X, valid: true, errors: [] }
      valid: true

  - description: 'CQ3: on conflict the later-listed ancestor wins'
    tier: core
    level: mapper
    id: 'mapping:child'
    mappings:
      'mapping:first':
        $id: 'mapping:first'
        mapping:
          /name: { constant: first }
      'mapping:second':
        $id: 'mapping:second'
        mapping:
          /name: { constant: second }
      'mapping:child':
        $id: 'mapping:child'
        $extend: ['mapping:first', 'mapping:second']
        mapping:
          /own: { constant: mine }
    input: {}
    expected:
      result: { name: second, own: mine, valid: true, errors: [] }
      valid: true

  - description: 'CQ3: diamond ancestry resolves; the shared grandparent pairing appears once'
    tier: core
    level: mapper
    id: 'mapping:child'
    mappings:
      'mapping:base':
        $id: 'mapping:base'
        mapping:
          /kind: { constant: base }
      'mapping:left':
        $id: 'mapping:left'
        $extend: 'mapping:base'
        mapping:
          /l: { constant: 1 }
      'mapping:right':
        $id: 'mapping:right'
        $extend: 'mapping:base'
        mapping:
          /r: { constant: 2 }
      'mapping:child':
        $id: 'mapping:child'
        $extend: ['mapping:left', 'mapping:right']
        mapping:
          /own: { constant: 3 }
    input: {}
    expected:
      result: { kind: base, l: 1, r: 2, own: 3, valid: true, errors: [] }
      valid: true

  - description: 'CQ3: an overriding pairing relocates to the winning ancestor position across the fold'
    tier: core
    level: mapper
    id: 'mapping:child'
    mappings:
      'mapping:one':
        $id: 'mapping:one'
        mapping:
          /b: { constant: original }
      'mapping:two':
        $id: 'mapping:two'
        mapping:
          /c: { constant: 1 }
          /b: { output: /c }
      'mapping:child':
        $id: 'mapping:child'
        $extend: ['mapping:one', 'mapping:two']
        mapping:
          /d: { constant: end }
    input: {}
    expected:
      # mapping:two's /b overrides mapping:one's and relocates after /c,
      # so it reads the already-written /c from the output
      result: { c: 1, b: 1, d: end, valid: true, errors: [] }
      valid: true

  - description: 'CQ3: an unknown id anywhere in the extend list raises an error'
    tier: core
    level: mapper
    id: 'mapping:child'
    mappings:
      'mapping:known':
        $id: 'mapping:known'
        mapping:
          /a: { constant: 1 }
      'mapping:child':
        $id: 'mapping:child'
        $extend: ['mapping:known', 'mapping:missing']
        mapping:
          /b: { constant: 2 }
    input: {}
    throws: Unknown mapping

  - description: 'CQ3: a one-element extend list is equivalent to the string form'
    tier: core
    level: mapper
    id: 'mapping:child'
    mappings:
      'mapping:base':
        $id: 'mapping:base'
        mapping:
          /a: { constant: 1 }
      'mapping:child':
        $id: 'mapping:child'
        $extend: ['mapping:base']
        mapping:
          /b: { constant: 2 }
    input: {}
    expected:
      result: { a: 1, b: 2, valid: true, errors: [] }
      valid: true

  - description: 'A12: a falsy each element is evaluated in its own position'
    level: map
    descriptor:
      mapping:
        /out:
          source: /items
          each:
            /v: /
    input:
      items: [1, 0, 2]
    expected:
      result:
        out:
          - { v: 1 }
          - { v: 0 }
          - { v: 2 }
      errors: []

  - description: 'write-through a falsy intermediate replaces it with a container'
    tier: core
    deviation: write-through
    level: map
    descriptor:
      mapping:
        /a: { constant: 0 }
        /a/b: { constant: 1 }
    input: {}
    expected:
      result: { a: { b: 1 } }
      errors: []

  - description: 'write-through a truthy primitive intermediate throws'
    tier: core
    deviation: write-through
    level: map
    descriptor:
      mapping:
        /a: { constant: 5 }
        /a/b: { constant: 1 }
    input: {}
    throws: Cannot create property
