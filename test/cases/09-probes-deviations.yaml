# Characterization probes. Each case pins the CURRENT observed behavior of the
# reference implementation, including behaviors identified as likely defects or
# portability hazards. Cases marked with a `deviation` key are candidates for
# the specification's "Known Deviations of the Reference Implementation"
# appendix: the spec may define different intended behavior, but this file must
# always reflect what the implementation actually does.
suite: probes
tests:
  - description: 'F1: pairings evaluate in document order — later pairings read earlier output'
    tier: core
    deviation: F1-key-order
    level: map
    descriptor:
      mapping:
        /a: { constant: 1 }
        /b: { output: /a }
    input: {}
    expected:
      result: { a: 1, b: 1 }
      errors: []

  - description: 'F1: reversed pairing order reads undefined — order is semantics'
    tier: core
    deviation: F1-key-order
    level: map
    descriptor:
      mapping:
        /b: { output: /a }
        /a: { constant: 1 }
    input: {}
    expected:
      result: { a: 1 }
      errors: []

  - description: 'F1: plugin keywords chain in descriptor key order (wrap then echo)'
    tier: core
    deviation: F1-key-order
    level: get
    descriptor:
      source: /v
      wrap: { key: inner }
      echo: {}
    input: { v: 1 }
    expected:
      value:
        options: {}
        value: { inner: 1 }
      errors: []

  - description: 'F1: plugin keywords chain in descriptor key order (echo then wrap)'
    tier: core
    deviation: F1-key-order
    level: get
    descriptor:
      source: /v
      echo: {}
      wrap: { key: inner }
    input: { v: 1 }
    expected:
      value:
        inner:
          options: {}
          value: 1
      errors: []

  - description: 'A1: a boolean value under a nested mapping is written'
    level: map
    descriptor:
      mapping:
        /x:
          source: /b
          mapping: { /y: / }
    input: { b: true }
    expected:
      result: { x: true }
      errors: []

  - description: 'A1: a null value under a nested mapping is written'
    level: map
    descriptor:
      mapping:
        /x:
          source: /b
          mapping: { /y: / }
    input: { b: null }
    expected:
      result: { x: null }
      errors: []

  - description: 'A1: a boolean selected by switch is written'
    level: map
    descriptor:
      mapping:
        /x:
          source: /
          switch:
            source: /kind
            cases:
              flag: /flag
    input: { kind: flag, flag: true }
    expected:
      result: { x: true }
      errors: []

  - description: 'A2: an empty array under a nested mapping maps to an empty array'
    level: map
    descriptor:
      mapping:
        /x:
          source: /list
          mapping: { /n: /name }
    input: { list: [] }
    expected:
      result: { x: [] }
      errors: []

  - description: 'A3: target index token "0" creates an array'
    level: map
    descriptor:
      mapping:
        /a/0/b: /v
    input: { v: x }
    expected:
      result:
        a:
          - { b: x }
      errors: []

  - description: 'A3: a beyond-length target index clamps to the array end'
    level: map
    descriptor:
      mapping:
        /a/1/b: /v
    input: { v: x }
    expected:
      result:
        a:
          - { b: x }
      errors: []

  - description: 'A3: a "-" next token creates an array and appends'
    level: map
    descriptor:
      mapping:
        /a/-: /v
    input: { v: x }
    expected:
      result:
        a:
          - x
      errors: []

  - description: 'A4: minLength skips an absent value'
    level: get
    descriptor: { source: /missing, minLength: 2 }
    input: {}
    expected: { value: __undefined__, errors: [] }

  - description: 'A4: maxLength skips an absent value'
    level: get
    descriptor: { source: /missing, maxLength: 2 }
    input: {}
    expected: { value: __undefined__, errors: [] }

  - description: 'A4: minLength skips an array'
    level: get
    descriptor: { source: /list, minLength: 3 }
    input: { list: [1, 2] }
    expected: { value: [1, 2], errors: [] }

  - description: 'A4: maxLength skips an array'
    level: get
    descriptor: { source: /list, maxLength: 1 }
    input: { list: [1, 2] }
    expected: { value: [1, 2], errors: [] }

  - description: 'A4: as string on an absent value yields undefined'
    level: get
    descriptor: { source: /missing, as: string }
    input: {}
    expected: { value: __undefined__, errors: [] }

  - description: 'A4: as number on an absent value yields undefined'
    level: get
    descriptor: { source: /missing, as: number }
    input: {}
    expected: { value: __undefined__, errors: [] }

  - description: 'A4: as boolean on an absent value yields undefined'
    level: get
    descriptor: { source: /missing, as: boolean }
    input: {}
    expected: { value: __undefined__, errors: [] }

  - description: 'A4: minimum 0 is enforced'
    level: get
    descriptor: { source: /n, minimum: 0 }
    input: { n: -5 }
    expected:
      value: -5
      errors:
        - { source: /n, value: -5, minimum: 0, message: cannot be less than 0 }

  - description: 'A4: maximum 0 is enforced'
    level: get
    descriptor: { source: /n, maximum: 0 }
    input: { n: 5 }
    expected:
      value: 5
      errors:
        - { source: /n, value: 5, maximum: 0, message: cannot be greater than 0 }

  - description: 'A4: multipleOf skips an absent value'
    level: get
    descriptor: { source: /missing, multipleOf: 3 }
    input: {}
    expected: { value: __undefined__, errors: [] }

  - description: 'A4: multipleOf skips a non-number'
    level: get
    descriptor: { source: /s, multipleOf: 2 }
    input: { s: abc }
    expected: { value: abc, errors: [] }

  - description: 'A4: multipleOf accepts a conforming decimal multiple'
    level: get
    descriptor: { source: /n, multipleOf: 0.1 }
    input: { n: 0.3 }
    expected: { value: 0.3, errors: [] }

  - description: 'A4: multipleOf rejects a non-multiple decimal'
    level: get
    descriptor: { source: /n, multipleOf: 0.1 }
    input: { n: 0.35 }
    expected:
      value: 0.35
      errors:
        - { source: /n, value: 0.35, multipleOf: 0.1, message: must be a multiple of 0.1 }

  - description: 'A4: type integer rejects a numeric string'
    level: get
    descriptor: { source: /s, type: integer }
    input: { s: '42' }
    expected:
      value: '42'
      errors:
        - { source: /s, value: '42', type: integer, message: must be an integer }

  - description: 'F6: random selects a member of the array (nondeterministic)'
    tier: experimental
    deviation: F6-random-nondeterminism
    level: get
    descriptor: { source: /list, random: 1 }
    input:
      list: [a, b, c]
    assert:
      /: { oneOf: [a, b, c] }
    expected: { errors: [] }

  - description: 'F6: random with unique selects distinct members'
    tier: experimental
    deviation: F6-random-nondeterminism
    level: get
    descriptor: { source: /list, random: 2, unique: true }
    input:
      list: [a, b]
    assert:
      /: { type: array, length: 2, subsetOf: [a, b] }
    expected: { errors: [] }

  - description: 'A9: requesting more unique members than exist is diagnosed'
    tier: experimental
    level: get
    descriptor: { source: /list, random: 3, unique: true }
    input: { list: [a, a, b] }
    expected:
      value: __undefined__
      errors:
        - { source: /list, value: [a, a, b], random: 3, message: cannot select 3 unique members }

  - description: 'A6: an unrecognized string descriptor yields a diagnostic and short-circuits'
    level: map
    descriptor:
      mapping:
        /x: not-a-pointer
    input: { a: 1 }
    expected:
      result: null
      errors:
        - { descriptor: not-a-pointer, message: unrecognized string descriptor }

  - description: 'A6: a bare fragment string descriptor is invalid'
    level: map
    descriptor:
      mapping:
        /x: '#/a'
    input: { a: 1 }
    expected:
      result: null
      errors:
        - { descriptor: '#/a', message: unrecognized string descriptor }

  - description: 'A8: a slash-prefixed pointer containing .. is diagnosed as invalid'
    level: get
    descriptor: /b/../d/e
    input:
      b: { c: 3 }
      d: { e: 5 }
    expected:
      value: __undefined__
      errors:
        - { descriptor: /b/../d/e, message: pointer must not contain .. segments }

  - description: 'A8: a source keyword pointer containing .. is diagnosed as invalid'
    level: get
    descriptor: { source: /b/../d/e }
    input:
      b: { c: 3 }
      d: { e: 5 }
    expected:
      value: __undefined__
      errors:
        - { source: /b/../d/e, message: pointer must not contain .. segments }

  - description: 'A8: a target keyword pointer containing .. is diagnosed as invalid'
    level: get
    descriptor: { target: /b/../d/e }
    input: { b: 1 }
    expected:
      value: __undefined__
      errors:
        - { target: /b/../d/e, message: pointer must not contain .. segments }

  - description: 'A8: an input keyword pointer containing .. is diagnosed as invalid'
    level: get
    descriptor: { input: /b/../d/e }
    input:
      b: { c: 3 }
      d: { e: 5 }
    expected:
      value: __undefined__
      errors:
        - { input: /b/../d/e, message: pointer must not contain .. segments }

  - description: 'A8: an output keyword pointer containing .. is diagnosed as invalid'
    level: get
    descriptor: { output: /b/../d/e }
    input: { b: 1 }
    expected:
      value: __undefined__
      errors:
        - { output: /b/../d/e, message: pointer must not contain .. segments }

  - description: 'A5: a variant list selects the first defined result, falsy included'
    level: map
    descriptor:
      mapping:
        /x: ['/zero', '/one']
    input: { zero: 0, one: 1 }
    expected:
      result: { x: 0 }
      errors: []

  - description: 'A5: the first combinator selects the first defined value'
    level: get
    descriptor:
      first: ['/zero', '/one']
    input: { zero: 0, one: 1 }
    expected: { value: 0, errors: [] }

  - description: 'A7: $ref to an unregistered id yields a diagnostic naming the id'
    level: map
    descriptor:
      mapping:
        /x: { $ref: 'mapping:nope' }
    input: { a: 1 }
    expected:
      result: null
      errors:
        - { $ref: 'mapping:nope', message: unknown mapping reference }

  - description: 'A10: switch.input reads the branch key from the root input'
    level: map
    descriptor:
      mapping:
        /x:
          source: /obj
          switch:
            input: /kind
            cases:
              a: { source: /, mapping: { /got: /a } }
              b: { source: /, mapping: { /got: /b } }
    input:
      kind: a
      obj: { kind: b, a: 1, b: 2 }
    expected:
      result:
        x: { got: 1 }
      errors: []

  - description: 'A10: switch.output reads the branch key from the root output'
    level: map
    descriptor:
      mapping:
        /kind: { constant: a }
        /x:
          source: /obj
          switch:
            output: /kind
            cases:
              a: { source: /, mapping: { /got: /a } }
              b: { source: /, mapping: { /got: /b } }
    input:
      obj: { kind: b, a: 1, b: 2 }
    expected:
      result:
        kind: a
        x: { got: 1 }
      errors: []

  - description: 'F8: stdout true logs the target object'
    tier: experimental
    deviation: F8-stdout-side-effect
    level: map
    descriptor:
      stdout: true
      mapping: { /a: /a }
    input: { a: 1 }
    expected:
      result: { a: 1 }
      stdout: { contains: '{"a":1}' }

  - description: 'F8: stdout with a pointer logs that part of the target as JSON'
    tier: experimental
    deviation: F8-stdout-side-effect
    level: map
    descriptor:
      stdout: /a
      mapping: { /a: /a }
    input: { a: 1 }
    expected:
      result: { a: 1 }
      stdout: { contains: '1' }
